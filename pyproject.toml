[project]
name = "ocr-2"
version = "0.1.0"
description = "General-purpose OCR system: EasyOCR + GPT-4o/Gemini + LangChain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "easyocr>=1.7.2",
    "torch>=2.0.0",
    "langchain-core>=1.2.14",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=1.1.10",
    "pymupdf>=1.27.2.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.45.0",
]
